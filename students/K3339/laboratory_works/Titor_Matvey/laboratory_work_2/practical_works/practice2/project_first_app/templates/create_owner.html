{% extends 'base.html' %}
{% block title %}Создание владельца{% endblock %}

{% block content %}
  <div class="card shadow-sm">
    <div class="card-header"><h1 class="h4 mb-0">Новый владелец</h1></div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Создать</button>
        <a class="btn btn-outline-secondary" href="{% url 'owners_list' %}">Отмена</a>
      </form>
    </div>
  </div>
{% endblock %}
