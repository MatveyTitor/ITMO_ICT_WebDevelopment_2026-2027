{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}

{% block content %}
  <div class="card shadow-sm">
    <div class="card-header"><h1 class="h4 mb-0">Создание учётной записи владельца</h1></div>
    <div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
      </form>
    </div>
  </div>
{% endblock %}
